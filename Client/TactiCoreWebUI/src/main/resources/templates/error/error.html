<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="tr">
<head>
    <title>TactiCore — Hata</title>
</head>
<body>
<div layout:fragment="content">
    <div class="tc-container">
        <div class="error-page">
            <div class="error-page__code">
                <span th:if="${statusCode}" th:text="${statusCode}"></span>
                <i th:unless="${statusCode}" class="bi bi-exclamation-triangle"></i>
            </div>
            <h1 class="error-page__title">Bir sorun oluştu</h1>
            <p class="error-page__message"
               th:text="${errorMessage} ?: 'Beklenmedik bir hata oluştu. Lütfen daha sonra tekrar deneyin.'">
                Beklenmedik bir hata oluştu.
            </p>
            <p class="error-page__message" th:if="${errorTime}" style="font-size:.8rem;">
                <span th:text="${#temporals.format(errorTime, 'dd.MM.yyyy HH:mm')}"></span>
            </p>
            <a th:href="@{/}" class="tc-btn tc-btn--primary">
                <i class="bi bi-house-door"></i> Ana Sayfaya Dön
            </a>
        </div>
    </div>
</div>
</body>
</html>
